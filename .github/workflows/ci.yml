name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        id: configure
        run: cmake -B build -S .

      - name: Build
        id: build
        run: cmake --build build --config Release

      - name: Run tests
        id: test
        run: |
          ctest --test-dir build --output-on-failure --output-junit report.xml | tee build/ctest_output.log

      - name: Generate Build Summary
        if: always()
        run: |
          echo "## ReMarkable build status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **CMake Configure** | \`${{ steps.configure.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build (Release)** | \`${{ steps.build.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tests (CTest)** | \`${{ steps.test.outcome }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: steps.build.outcome == 'success'
        with:
          name: CTest Results
          path: build/report.xml
          reporter: java-junit