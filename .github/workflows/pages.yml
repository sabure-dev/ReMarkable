name: Deploy web UI to Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.7

      - name: Build WebAssembly module
        run: |
          mkdir -p site
          em++ -std=c++17 -O2 \
            web/wasm_api.cpp \
            BMP-info/BMPReader.cpp BMP-info/BMPEditor.cpp BMP-info/BMPClass.cpp \
            Watermark/overlay.cpp \
            -I BMP-info -I Watermark \
            -o site/remarkable.js \
            -sMODULARIZE=1 -sEXPORT_NAME=createRemarkable \
            -sEXPORTED_FUNCTIONS=_apply_watermark \
            -sEXPORTED_RUNTIME_METHODS=ccall,FS \
            -sFORCE_FILESYSTEM=1 -sALLOW_MEMORY_GROWTH=1

      - name: Assemble site
        run: |
          cp web/index.html site/
          cp -r examples site/examples

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
